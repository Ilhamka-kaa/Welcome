<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IHK-Project</title>
  <link rel="icon" type="image/png" href="assets/logo_square.png?v=1.0.1">
  <link rel="shortcut icon" type="image/png" href="assets/logo_square.png?v=1.0.1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Syne:wght@400;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="opening-active opening-welcome">

  <div id="cur" style="display: none;"></div>
  <div id="cur-ring" style="display: none;"></div>

  <!-- OPENING ANIMATION OVERLAY -->
  <div id="opening-overlay">
    <canvas id="intro-canvas"></canvas>
    
    <div class="welcome-container" id="welcome-container">
      <div class="minimal-loader">
        
        <!-- Elegant 3D Concentric Dual Cube Loader -->
        <div class="cube-wrapper">
          <!-- Outer Cube -->
          <div class="cube-outer">
            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face right"></div>
            <div class="face left"></div>
            <div class="face top"></div>
            <div class="face bottom"></div>
          </div>
          <!-- Inner Cube -->
          <div class="cube-inner" id="cube-inner">
            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face right"></div>
            <div class="face left"></div>
            <div class="face top"></div>
            <div class="face bottom"></div>
          </div>
          <!-- Core Node -->
          <div class="cube-core" id="cube-core"></div>
        </div>

        <!-- Elegant thin divider line -->
        <div class="elegant-divider">
          <span class="divider-tick-left">+</span>
          <div class="divider-line"></div>
          <span class="divider-tick-right">+</span>
        </div>

        <!-- Typography welcome lines -->
        <div class="welcome-text-wrap">
          <div class="welcome-text-line" id="welcome-text">WELCOME</div>
          <div class="welcome-subtext">SYSTEM INITIALIZED // IHK.PROJECT</div>
        </div>

        <!-- Smooth thin progress bar -->
        <div class="progress-bar-container">
          <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="technical-stats">
          <span class="stat-left">SYS.INIT.026</span>
          <span class="stat-center" id="loader-text">00%</span>
          <span class="stat-right">-6.9175°S</span>
        </div>
      </div>
    </div>
  </div>

  <div id="progress">
    <div class="dot active" data-i="0"></div>
    <div class="dot" data-i="1"></div>
    <div class="dot" data-i="2"></div>
  </div>
  <div id="scroll-line" style="width:0%"></div>

  <div id="stage">
    <!-- PAGE 1 -->
    <div class="page is-current" id="p1"></div>

    <!-- PAGE 2 -->
    <div class="page hidden" id="p2"></div>

    <!-- PAGE 3 -->
    <div class="page hidden" id="p3"></div>
  </div>

  <!-- Drag zones -->
  <div class="drag-zone left" id="dz-left">
    <div class="arrow-pill" id="ap-left">
      <svg viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <polyline points="10 4 6 8 10 12" />
      </svg>
    </div>
  </div>
  <div class="drag-zone right" id="dz-right">
    <div class="arrow-pill" id="ap-right">
      <svg viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <polyline points="6 4 10 8 6 12" />
      </svg>
    </div>
  </div>

  <!-- GAME MODAL -->
  <div class="game-modal" id="gameModal">
    <div class="game-modal-header">
      <div class="game-modal-title">
        <span id="gameModalTitle">GAME</span>
      </div>
      <button class="game-modal-close" id="gameModalClose">✕</button>
    </div>
    <div class="game-modal-content" id="gameModalContent">
      <!-- Game iframe will be inserted here -->
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
