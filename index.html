<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IHK-Project</title>
  <link rel="icon" type="image/png" href="assets/logo_square.png?v=1.0.1">
  <link rel="shortcut icon" type="image/png" href="assets/logo_square.png?v=1.0.1">
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="cur"></div>
  <div id="cur-ring"></div>

  <div id="progress">
    <div class="dot active" data-i="0"></div>
    <div class="dot" data-i="1"></div>
    <div class="dot" data-i="2"></div>
  </div>
  <div id="scroll-line" style="width:0%"></div>

  <div id="stage">
    <!-- PAGE 1 -->
    <div class="page is-current" id="p1"></div>

    <!-- PAGE 2 -->
    <div class="page hidden" id="p2"></div>

    <!-- PAGE 3 -->
    <div class="page hidden" id="p3"></div>
  </div>

  <!-- Drag zones -->
  <div class="drag-zone left" id="dz-left">
    <div class="arrow-pill" id="ap-left">
      <svg viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <polyline points="10 4 6 8 10 12" />
      </svg>
    </div>
  </div>
  <div class="drag-zone right" id="dz-right">
    <div class="arrow-pill" id="ap-right">
      <svg viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <polyline points="6 4 10 8 6 12" />
      </svg>
    </div>
  </div>

  <!-- GAME MODAL -->
  <div class="game-modal" id="gameModal">
    <div class="game-modal-header">
      <div class="game-modal-title">
        <span id="gameModalTitle">GAME</span>
      </div>
      <button class="game-modal-close" id="gameModalClose">✕</button>
    </div>
    <div class="game-modal-content" id="gameModalContent">
      <!-- Game iframe will be inserted here -->
    </div>
  </div>

  <!-- ── BACKGROUND SETTINGS PANEL (Page 1 only, bottom-right) ── -->
  <div id="bg-panel-wrap">
    <button id="bg-panel-toggle" title="Background Settings" aria-label="Toggle background settings">
      <span></span><span></span><span></span>
    </button>

    <div class="bg-panel" id="bgPanel">
      <div class="bg-panel-header">
        <span class="bg-panel-title">// BG CONFIG</span>
        <button class="bg-panel-close" id="bgPanelClose" aria-label="Close">✕</button>
      </div>
      <div class="bg-panel-body">

        <div class="bg-ctrl-group">
          <label class="bg-ctrl-label">Warna Partikel</label>
          <input type="color" id="bgColor" value="#FFE600" class="bg-color-input">
        </div>

        <hr class="bg-divider">

        <div class="bg-ctrl-group">
          <div class="bg-ctrl-row">
            <label class="bg-ctrl-label">Speed</label>
            <span class="bg-ctrl-val" id="bgSpeedVal">0.8</span>
          </div>
          <input type="range" id="bgSpeed" min="0" max="5" step="0.1" value="0.8" class="bg-range">
        </div>

        <div class="bg-ctrl-group">
          <div class="bg-ctrl-row">
            <label class="bg-ctrl-label">Koneksi</label>
            <span class="bg-ctrl-val" id="bgConnectVal">110</span>
          </div>
          <input type="range" id="bgConnect" min="50" max="300" value="110" class="bg-range">
        </div>

        <div class="bg-ctrl-group">
          <div class="bg-ctrl-row">
            <label class="bg-ctrl-label">Mouse Radius</label>
            <span class="bg-ctrl-val" id="bgRadiusVal">130</span>
          </div>
          <input type="range" id="bgRadius" min="30" max="300" value="130" class="bg-range">
        </div>

        <hr class="bg-divider">

        <button class="bg-reset-btn" id="bgReset">[ Reset Grid ]</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
