<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Cyber Network — Neo Brutalism</title>
    <style>
        :root {
            --theme-color: #FFE600;
            --border-color: #000000;
            --panel-bg: #FFFFFF;
            --text-color: #000000;
            --shadow-offset: 5px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #1a1a1a;
            font-family: 'Courier New', Courier, monospace;
        }

        canvas {
            display: block;
        }

        /* --- TOMBOL TOGGLE --- */
        #toggleBtn {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 100;
            width: 44px;
            height: 44px;
            background: var(--theme-color);
            border: 3px solid var(--border-color);
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--border-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            flex-direction: column;
            gap: 5px;
            transition: box-shadow 0.1s, transform 0.1s;
        }

        #toggleBtn::before,
        #toggleBtn::after,
        #toggleBtn span {
            content: '';
            display: block;
            width: 20px;
            height: 3px;
            background: var(--border-color);
        }

        #toggleBtn:hover {
            box-shadow: 7px 7px 0px var(--border-color);
            transform: translate(-2px, -2px);
        }

        #toggleBtn:active {
            box-shadow: 2px 2px 0px var(--border-color);
            transform: translate(3px, 3px);
        }

        /* --- PANEL KONTROL --- */
        .controls {
            position: absolute;
            top: 80px;
            right: 24px;
            background: var(--panel-bg);
            padding: 0;
            border: 3px solid var(--border-color);
            box-shadow: 8px 8px 0px var(--border-color);
            color: var(--text-color);
            width: 220px;
            user-select: none;
            transition: opacity 0.2s, transform 0.2s;
            transform-origin: top right;
            opacity: 1;
            transform: scale(1);
            visibility: visible;
        }

        .controls.hidden {
            opacity: 0;
            transform: scale(0.95) translateY(-8px);
            visibility: hidden;
            pointer-events: none;
        }

        .panel-header {
            background: var(--theme-color);
            border-bottom: 3px solid var(--border-color);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls h3 {
            margin: 0;
            font-size: 0.85rem;
            color: var(--text-color);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 900;
        }

        .panel-body {
            padding: 14px;
        }

        .control-group {
            margin-bottom: 14px;
        }

        .control-group label {
            display: block;
            font-size: 0.72rem;
            margin-bottom: 6px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-color);
        }

        input[type="color"] {
            width: 100%;
            height: 36px;
            border: 3px solid var(--border-color);
            background: transparent;
            cursor: pointer;
            padding: 2px;
            box-shadow: 3px 3px 0px var(--border-color);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border: 2px solid var(--border-color);
            cursor: pointer;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: var(--theme-color);
            border: 3px solid var(--border-color);
            cursor: pointer;
        }

        .slider-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .slider-val {
            font-size: 0.75rem;
            font-weight: 900;
            background: var(--theme-color);
            border: 2px solid var(--border-color);
            padding: 1px 6px;
            min-width: 32px;
            text-align: center;
        }

        button.action-btn {
            width: 100%;
            padding: 10px;
            background: var(--text-color);
            border: 3px solid var(--border-color);
            color: var(--theme-color);
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 2px;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: 4px 4px 0px #555;
            transition: box-shadow 0.1s, transform 0.1s;
        }

        button.action-btn:hover {
            box-shadow: 6px 6px 0px #555;
            transform: translate(-2px, -2px);
        }

        button.action-btn:active {
            box-shadow: 1px 1px 0px #555;
            transform: translate(3px, 3px);
        }

        /* Divider */
        .divider {
            border: none;
            border-top: 2px solid var(--border-color);
            margin: 12px 0;
        }

        /* Stats bar */
        #statsBar {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: var(--panel-bg);
            border: 3px solid var(--border-color);
            box-shadow: 5px 5px 0px var(--border-color);
            padding: 6px 14px;
            font-size: 0.72rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
        }

        #statsBar span {
            background: var(--theme-color);
            padding: 1px 5px;
            border: 1px solid var(--border-color);
            margin-left: 4px;
        }
    </style>
</head>

<body>

    <button id="toggleBtn" title="Menu">
        <span></span>
    </button>

    <div class="controls" id="controlPanel">
        <div class="panel-header">
            <h3>// Config</h3>
        </div>
        <div class="panel-body">
            <div class="control-group">
                <label>Warna Tema</label>
                <input type="color" id="colorPicker" value="#FFE600">
            </div>

            <hr class="divider">

            <div class="control-group">
                <div class="slider-row">
                    <label>Speed</label>
                    <span class="slider-val" id="speedVal">1.0</span>
                </div>
                <input type="range" id="speedRange" min="0" max="5" step="0.1" value="1">
            </div>

            <div class="control-group">
                <div class="slider-row">
                    <label>Connection</label>
                    <span class="slider-val" id="connectVal">100</span>
                </div>
                <input type="range" id="connectRange" min="50" max="250" value="100">
            </div>

            <hr class="divider">

            <button class="action-btn" onclick="resetParticles()">[ Reset Grid ]</button>
        </div>
    </div>
    <canvas id="canvas1"></canvas>

    <script>
        const canvas = document.getElementById('canvas1');
        const ctx = canvas.getContext('2d');
        const toggleBtn = document.getElementById('toggleBtn');
        const controlPanel = document.getElementById('controlPanel');
        const statsEl = document.getElementById('particleCount');

        function updateThemeColor(color) {
            document.documentElement.style.setProperty('--theme-color', color);
            settings.color = color;
        }

        toggleBtn.addEventListener('click', () => {
            controlPanel.classList.toggle('hidden');
        });

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray;

        let settings = {
            color: '#FFE600',
            speed: 1,
            connectionDistance: 100,
        };

        const colorPicker = document.getElementById('colorPicker');
        const speedRange = document.getElementById('speedRange');
        const connectRange = document.getElementById('connectRange');
        const speedVal = document.getElementById('speedVal');
        const connectVal = document.getElementById('connectVal');

        let mouse = { x: null, y: null, radius: 150 };

        window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });

        colorPicker.addEventListener('input', (e) => { updateThemeColor(e.target.value); });

        speedRange.addEventListener('input', (e) => {
            settings.speed = parseFloat(e.target.value);
            speedVal.innerText = parseFloat(settings.speed).toFixed(1);
        });

        connectRange.addEventListener('input', (e) => {
            settings.connectionDistance = e.target.value;
            connectVal.innerText = settings.connectionDistance;
        });

        class Particle {
            constructor(x, y, dx, dy, size) {
                this.x = x;
                this.y = y;
                this.dx = dx;
                this.dy = dy;
                this.size = size;
                this.baseX = x;
                this.baseY = y;
                this.density = (Math.random() * 30) + 1;
                this.shape = Math.random() > 0.5 ? 'square' : 'circle';
            }

            draw() {
                ctx.fillStyle = settings.color;
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 1.5;

                if (this.shape === 'square') {
                    const s = this.size * 2;
                    ctx.fillRect(this.x - s / 2, this.y - s / 2, s, s);
                    ctx.strokeRect(this.x - s / 2, this.y - s / 2, s, s);
                } else {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                    ctx.fill();
                    ctx.stroke();
                }
            }

            update() {
                if (this.x > canvas.width || this.x < 0) this.dx = -this.dx;
                if (this.y > canvas.height || this.y < 0) this.dy = -this.dy;

                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < mouse.radius) {
                    const forceDirectionX = dx / distance;
                    const forceDirectionY = dy / distance;
                    const force = (mouse.radius - distance) / mouse.radius;
                    this.x -= forceDirectionX * force * this.density;
                    this.y -= forceDirectionY * force * this.density;
                }

                this.x += this.dx * settings.speed;
                this.y += this.dy * settings.speed;

                this.draw();
            }
        }

        function hexToRgb(hex) {
            let bigint = parseInt(hex.slice(1), 16);
            let r = (bigint >> 16) & 255;
            let g = (bigint >> 8) & 255;
            let b = bigint & 255;
            return `${r},${g},${b}`;
        }

        function init() {
            particlesArray = [];
            let count = Math.floor((canvas.height * canvas.width) / 9000);
            for (let i = 0; i < count; i++) {
                let size = (Math.random() * 3) + 1;
                let x = Math.random() * (canvas.width - size * 4) + size * 2;
                let y = Math.random() * (canvas.height - size * 4) + size * 2;
                let dx = (Math.random() * 2) - 1;
                let dy = (Math.random() * 2) - 1;
                particlesArray.push(new Particle(x, y, dx, dy, size));
            }
            if (statsEl) statsEl.innerText = particlesArray.length;
        }

        function connect() {
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let dist = ((particlesArray[a].x - particlesArray[b].x) ** 2)
                        + ((particlesArray[a].y - particlesArray[b].y) ** 2);
                    let maxDist = settings.connectionDistance ** 2;
                    if (dist < maxDist) {
                        let opacity = 1 - (dist / maxDist);
                        // Neo-brutalism: hard-edged lines, black stroke dominant
                        if (opacity > 0.6) {
                            ctx.strokeStyle = `#000000`;
                            ctx.lineWidth = 1.5;
                        } else {
                            ctx.strokeStyle = `rgba(${hexToRgb(settings.color)}, ${opacity})`;
                            ctx.lineWidth = 0.8;
                        }
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            // Neo-brutalism bg: tidak pure black, sedikit warm dark
            ctx.fillStyle = 'rgba(26, 26, 26, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
            connect();
        }

        window.addEventListener('resize', () => {
            canvas.width = innerWidth;
            canvas.height = innerHeight;
            init();
        });

        window.addEventListener('click', (e) => {
            if (e.target.closest('.controls') || e.target.closest('#toggleBtn') || e.target.closest('#statsBar')) return;
            for (let i = 0; i < 5; i++) {
                let size = (Math.random() * 3) + 1;
                let dx = (Math.random() * 5) - 2.5;
                let dy = (Math.random() * 5) - 2.5;
                particlesArray.push(new Particle(e.x, e.y, dx, dy, size));
            }
            if (statsEl) statsEl.innerText = particlesArray.length;
        });

        function resetParticles() { init(); }

        init();
        animate();
    </script>
</body>

</html>
